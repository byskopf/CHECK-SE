name: Criar tag de versão

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão no formato X.Y.Z (exemplo: 1.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-version-tag
  cancel-in-progress: false

jobs:
  create-tag:
    name: Validar e criar tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar todo o histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar versão informada
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A versão deve usar o formato X.Y.Z, sem a letra v." >&2
            exit 1
          fi
          echo "tag=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validar PWA
        uses: ./.github/actions/validate-pwa

      - name: Confirmar versão dos arquivos
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const expected = process.env.INPUT_VERSION;
          const config = require('./app-config.js');
          const packageJson = require('./package.json');
          const serviceWorker = fs.readFileSync('sw.js', 'utf8');
          const importedVersion = serviceWorker.match(/app-config\.js\?v=([^'"]+)/)?.[1];

          if (config.version !== expected) {
            throw new Error('Versão em app-config.js não corresponde a ' + expected);
          }
          if (packageJson.version !== expected) {
            throw new Error('Versão em package.json não corresponde a ' + expected);
          }
          if (importedVersion !== expected) {
            throw new Error('Versão importada pelo sw.js não corresponde a ' + expected);
          }
          NODE

      - name: Impedir tag duplicada
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "A tag $TAG já existe." >&2
            exit 1
          fi

      - name: Criar e publicar tag anotada
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "CHECK-SE $TAG"
          git push origin "$TAG"
