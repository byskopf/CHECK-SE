<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2239">
  <meta name="robots" content="noindex">
  <title>CHECK-SELT</title>
  <!-- Porta de quem instalou o portal antigo em setembro/2026 (o ícone abre este arquivo). Antes levava ao
       endereço antigo da Central, que hoje só mostra um aviso; agora abre o aplicativo de campo. -->
  <script>
    /* 04/10/2026 (V5.6): leva a consulta de quem abriu (sem origem/abrir/de, pares crus, sem o hash) mais a
       marca de=pwa-antigo, para o app oferecer a ida ao checkselt.com. Mesma regra da função consultaDoApp(). */
    var partes = String(location.search || '').replace(/^\?/, '').split('&').filter(function (p) {
      var k = p.split('=')[0];
      return p && k !== 'origem' && k !== 'abrir' && k !== 'de';
    });
    partes.push('de=pwa-antigo');
    window.location.replace('https://script.google.com/macros/s/AKfycbzo_WN_PzoRhS-LhV070vmE8GDr1vJX9qEa1iqxADe6kVhNZa968olZLVVDAtObmvE/exec' + '?' + partes.join('&'));
  </script>
</head>
<body>
  <p>Abrindo o CHECK-SELT… <a href="https://checkselt.com/">Se não abrir, toque aqui.</a></p>
</body>
</html>
