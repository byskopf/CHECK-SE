name: Validar PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verificar arquivos e sintaxe
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar estrutura do PWA
        run: node scripts/validate-pwa.mjs

      - name: Validar sintaxe JavaScript
        run: |
          node --check app.js
          node --check sw.js
