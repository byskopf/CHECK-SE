name: Monitorar disponibilidade

# Roda sozinho a cada 3 horas e confere se os dois links do CHECK-SE respondem.
# Se algum falhar, esta Action fica vermelha, o GitHub manda um e-mail
# automaticamente para quem tem notificações de Actions ativadas neste repositório
# (Configurações da conta do GitHub > Notifications > Actions), e uma Issue é
# aberta/atualizada automaticamente para deixar o alerta visível mesmo para quem
# não recebe e-mail de Actions.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Portal de instalação (GitHub Pages)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://byskopf.github.io/CHECK-SE/")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Portal respondeu HTTP $status (esperado 200)."
            exit 1
          fi

      - name: App oficial (Apps Script - produção)
        run: |
          body=$(curl -s --max-time 30 "https://script.google.com/macros/s/AKfycbx7ReYi1OoXTvO2e-FLXczg-Ube0WZcjJSWe8HGlWbQtUof1F-1dOUQ-kqrwZQPjb6D/exec")
          tamanho=${#body}
          echo "Tamanho recebido: $tamanho bytes"
          # A pagina normal do app tem mais de 300 KB. Uma resposta pequena costuma
          # significar erro do Apps Script, cota excedida ou implantação fora do ar -
          # nao um HTTP 500 (o Apps Script normalmente devolve 200 mesmo quando falha).
          if [ "$tamanho" -lt 300000 ]; then
            echo "::error::App oficial devolveu uma página pequena demais ($tamanho bytes) - pode estar fora do ar."
            exit 1
          fi
          # Checagem por conteúdo, além do tamanho: garante que a página é
          # mesmo a tela do CHECK-SE, e não uma página de erro grande (ex.: um
          # stack trace) que por acaso passe do limiar de tamanho acima.
          if ! echo "$body" | grep -q "CHECK-SE"; then
            echo "::error::Resposta do Apps Script não contém 'CHECK-SE' - conteúdo inesperado."
            exit 1
          fi

      - name: Abrir/atualizar Issue de alerta
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 Monitoramento: CHECK-SE fora do ar';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `O monitoramento automático detectou uma falha em ${new Date().toISOString()}.\n\nVeja o log da execução: ${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'monitoramento',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['monitoramento'],
              });
            }

      - name: Fechar Issue de alerta (recuperado)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 Monitoramento: CHECK-SE fora do ar';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'monitoramento',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Voltou ao normal em ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
